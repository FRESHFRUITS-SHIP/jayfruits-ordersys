<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ shop_name }} — Settings</title>
<style>
  :root{ --green:#1F4D36; --orange:#FF6A3D; --cream:#FFF8ED; }
  *{box-sizing:border-box;}
  body{ font-family: system-ui, sans-serif; background:#F7F4EC; margin:0; }
  header{ background:var(--green); color:var(--cream); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  header a{ color:var(--cream); text-decoration:none; font-size:13px; }
  .wrap{ max-width:500px; margin:0 auto; padding:16px; }
  .card{ background:white; border-radius:12px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  label{ display:block; font-size:12px; font-weight:700; color:var(--green); margin:14px 0 5px; text-transform:uppercase; }
  input{ width:100%; padding:9px 10px; border-radius:8px; border:1px solid #ddd; font-size:14px; }
  button{ width:100%; margin-top:20px; background:var(--orange); color:white; border:none; padding:12px; border-radius:10px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Settings</h1>
  <a href="/orders">← Back</a>
</header>
<div class="wrap">
  <form class="card" method="post" action="/settings">
    <label>Minimum order value (₹, 0 = no minimum)</label>
    <input type="number" step="1" name="minimum_order_value" value="{{ settings.minimum_order_value }}">

    <label>Business hours start (24h, e.g. 7)</label>
    <input type="number" min="0" max="23" name="business_hours_start" value="{{ settings.business_hours_start }}">

    <label>Business hours end (24h, e.g. 22)</label>
    <input type="number" min="0" max="23" name="business_hours_end" value="{{ settings.business_hours_end }}">

    <button type="submit">Save Settings</button>
  </form>
</div>
</body>
</html>
