<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ shop_name }} — Dashboard Login</title>
<style>
  body{ font-family: system-ui, sans-serif; background:#1F4D36; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box{ background:#FFF8ED; padding:40px; border-radius:12px; width:300px; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
  h1{ font-size:20px; color:#1F4D36; margin-bottom:20px; }
  input{ width:100%; padding:10px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
  button{ width:100%; padding:10px; background:#FF6A3D; color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer; }
  .error{ color:#c0392b; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>{{ shop_name }} — Orders</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
